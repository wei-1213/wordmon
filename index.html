<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wordmon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: left nav / centre stage / right status panel on desktop; single column with bottom nav on phones. Single warm fantasy look by design. */
:root{
  --cream:#fff8ec; --paper:#fffdf6; --beige:#f1e4cc; --beige-d:#dcc9a6;
  --purple:#8b6bc9; --purple-d:#5d4296; --purple-l:#e6dcf8;
  --brown:#4a3226; --brown-l:#7d6150; --gold:#e6c36a; --gold-d:#b8902f;
  --good:#4f9b5a; --bad:#cf5a4a;
  --shadow:0 6px 18px rgba(74,50,38,.14);
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--brown);font:15px/1.55 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;
  background-image:radial-gradient(circle at 12% 0%,#efe3ff 0,transparent 38%),radial-gradient(circle at 100% 30%,#fbe9c8 0,transparent 35%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:grid;gap:16px;grid-template-columns:200px minmax(0,1fr) 270px;grid-template-areas:"top top top" "nav view aside"}
#topbar{grid-area:top}#nav{grid-area:nav}#view{grid-area:view;min-width:0}#aside{grid-area:aside;min-width:0}
.card{background:var(--paper);border:2px solid var(--beige-d);border-radius:18px;box-shadow:var(--shadow);padding:16px;position:relative}
.card.gilt{border-color:var(--gold);box-shadow:var(--shadow),inset 0 0 0 3px #fff6dc}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance}
h2{font-size:22px;margin-bottom:10px}h3{font-size:17px;margin-bottom:6px}
.muted{color:var(--brown-l)}.small{font-size:13px}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px}
.logo{font-family:var(--serif);font-weight:900;font-size:26px;color:var(--purple-d);letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo svg{width:34px;height:34px}
.lvl{display:flex;flex-direction:column;gap:4px;min-width:200px;flex:1 1 220px;max-width:340px}
.lvl-t{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.bar{height:12px;border-radius:99px;background:var(--beige);border:2px solid var(--beige-d);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),#b79af0);transition:width .5s}
.bar.gold>i{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.coins{display:flex;align-items:center;gap:6px;font-weight:900;background:#fff3cf;border:2px solid var(--gold);border-radius:99px;padding:3px 12px}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,var(--gold-d));border:2px solid var(--gold-d)}
.seg{display:inline-flex;border:2px solid var(--purple);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;font-weight:700;color:var(--purple-d)}
.seg button[aria-pressed=true]{background:var(--purple);color:#fff}
/* nav */
.nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;align-self:start}
.nav button{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:transparent;border-radius:14px;padding:10px 12px;font-weight:700;text-align:left}
.nav button:hover{background:var(--purple-l)}
.nav button[aria-current=page]{background:var(--paper);border-color:var(--purple);color:var(--purple-d);box-shadow:var(--shadow)}
.nav svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* buttons */
.btn{border:2px solid var(--purple-d);background:linear-gradient(#a283e0,var(--purple));color:#fff;font-weight:900;border-radius:14px;padding:11px 22px;box-shadow:0 4px 0 var(--purple-d);transition:transform .08s,box-shadow .08s;font-size:16px}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-d)}
.btn.gold{background:linear-gradient(#f3d98a,var(--gold));border-color:var(--gold-d);color:var(--brown);box-shadow:0 4px 0 var(--gold-d)}
.btn.ghost{background:var(--paper);color:var(--purple-d);box-shadow:0 4px 0 var(--beige-d);border-color:var(--beige-d)}
.btn:disabled{filter:grayscale(.7) opacity(.6);cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--beige-d)}
.btn.big{font-size:19px;padding:14px 30px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{padding:0;overflow:hidden;min-height:340px;border-radius:22px}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero .pet{position:absolute;left:50%;bottom:62px;width:210px;transform:translateX(-50%);animation:bob 3s ease-in-out infinite}
.hero .cta{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center}
.hero .tag{position:absolute;left:14px;top:14px;background:rgba(255,253,246,.9);border:2px solid var(--beige-d);border-radius:12px;padding:6px 12px;font-weight:700}
@keyframes bob{50%{transform:translateX(-50%) translateY(-8px)}}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.menu button{background:var(--paper);border:2px solid var(--beige-d);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.menu button:hover{border-color:var(--purple)}
.menu b{display:block;font-family:var(--serif);font-size:16px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--beige);border:2px solid var(--beige-d)}
.dots i.ok{background:var(--good);border-color:#357a40}.dots i.no{background:var(--bad);border-color:#a23d30}.dots i.cur{border-color:var(--purple);background:var(--purple-l)}
.word{text-align:center;padding:26px 8px 18px}
.word .w{overflow-wrap:anywhere;font-size:clamp(44px,12vw,72px);font-weight:900;line-height:1.15;font-family:var(--sans)}
.word .r{color:var(--brown-l);font-size:18px;min-height:27px}
.speak{border:2px solid var(--beige-d);background:var(--paper);border-radius:99px;padding:4px 14px;font-weight:700;margin-top:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;align-items:center;gap:10px;min-height:64px;text-align:left;border:2px solid var(--beige-d);background:#fff;border-radius:16px;padding:10px 14px;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--beige-d)}
.choice:hover:not(:disabled){border-color:var(--purple);background:var(--purple-l)}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--beige);display:grid;place-items:center;font-size:13px}
.choice.right{background:#e3f5e1;border-color:var(--good);box-shadow:0 4px 0 #357a40}
.choice.wrong{background:#fde5e1;border-color:var(--bad);box-shadow:0 4px 0 #a23d30;animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{background:#e3f5e1;border:2px solid var(--good)}.fb.no{background:#fde5e1;border:2px solid var(--bad)}
.fb .gain{font-size:13px;color:var(--brown-l)}
/* result */
.score{font-family:var(--serif);font-weight:900;font-size:60px;color:var(--purple-d);line-height:1}
.rw{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.rw div{background:var(--cream);border:2px solid var(--beige-d);border-radius:14px;padding:10px;text-align:center}
.rw b{display:block;font-size:22px;font-family:var(--serif)}
.banner{background:linear-gradient(90deg,#fff3cf,#f3e8ff);border:2px solid var(--gold);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:8px}
.wl{display:grid;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.wl li{display:flex;justify-content:space-between;gap:10px;background:var(--cream);border-radius:10px;padding:6px 12px}
/* spirits */
.spirit{display:block;width:100%;height:auto;overflow:visible}
.sil{position:relative}.sil svg{filter:brightness(0) opacity(.28)}
.sil::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:900 44px var(--serif);color:var(--brown-l)}
.ranch{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:center}
.stage-bg{border-radius:18px;padding:10px;background:radial-gradient(circle at 50% 70%,var(--sbg,#f3e8ff),transparent 70%),var(--cream);border:2px solid var(--beige-d)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:2px solid var(--beige-d);background:var(--paper);border-radius:99px;padding:5px 14px;font-weight:700;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{border-color:var(--purple);background:var(--purple-l);color:var(--purple-d)}
.chip.lock{opacity:.65}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--brown)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stages div{text-align:center;font-size:12px;border:2px solid var(--beige-d);border-radius:12px;padding:4px;background:var(--cream)}
.stages div.on{border-color:var(--purple);background:var(--purple-l)}.stages div.off svg{filter:brightness(0) opacity(.25)}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;border:2px solid currentColor}
.elrow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.elrow div{text-align:center;border-radius:14px;padding:8px 2px;border:2px solid var(--beige-d);background:var(--paper)}
.elrow b{font-family:var(--serif);font-size:20px;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{border:2px solid var(--beige-d);background:var(--paper);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--purple)}
.pcard .nm{font-family:var(--serif);font-weight:900;font-size:16px}
.pcard.locked{background:#f4ecda}
/* modal */
.modal{position:fixed;inset:0;background:rgba(60,40,30,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.x{position:absolute;right:10px;top:10px;border:0;background:var(--beige);border-radius:50%;width:32px;height:32px;font-weight:900}
/* misc */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;border:2px solid var(--beige-d);border-radius:14px;padding:10px;background:var(--paper)}
.badge.off{opacity:.5;filter:grayscale(1)}
.medal{flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,var(--gold) 55%,var(--gold-d));border:2px solid var(--gold-d);display:grid;place-items:center;font-weight:900}
.areas{display:grid;gap:8px}
.area{display:flex;justify-content:space-between;gap:10px;border-radius:12px;padding:10px 14px;border:2px solid var(--beige-d);background:var(--paper)}
.area.off{background:#f4ecda;color:var(--brown-l)}
table.st{width:100%;border-collapse:collapse}table.st td,table.st th{padding:6px 8px;border-bottom:1px solid var(--beige);text-align:left}
.side{display:grid;gap:12px;align-content:start}
.side .card{padding:14px}.side b.big{font-family:var(--serif);font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.08)}}
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "view" "aside"}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:2px solid var(--beige-d);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .nav{flex-direction:row;justify-content:space-around;gap:0;position:static}
  .nav button{flex-direction:column;gap:2px;padding:4px 2px;font-size:10px;white-space:nowrap;flex:1;min-width:0;justify-content:center;align-items:center;text-align:center}
  .app{padding-bottom:76px}
  .lvl{max-width:none}
}
/* 精靈猜猜看 */
.fstage{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;align-items:center;margin:12px 0}
.fpet{position:relative}.fpet.happy{animation:hop .5s}.fpet.sad{animation:shake .4s}
@keyframes hop{30%{transform:translateY(-16px) scale(1.05)}}
.bubble{position:relative;background:#fff;border:2px solid var(--beige-d);border-radius:20px;padding:16px 18px;text-align:center;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:18px;height:18px;background:#fff;border-left:2px solid var(--beige-d);border-bottom:2px solid var(--beige-d);transform:translateY(-50%) rotate(45deg)}
.bubble.ok{border-color:var(--good);background:#e3f5e1}.bubble.no{border-color:var(--bad);background:#fde5e1}
.bubble.ok::before{background:#e3f5e1;border-color:var(--good)}.bubble.no::before{background:#fde5e1;border-color:var(--bad)}
.bubble .w{font-size:clamp(34px,8vw,54px);font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.bubble .r{color:var(--brown-l);min-height:22px}
.bubble .eq{font-size:22px;margin-top:6px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn .btn{padding:16px;font-size:20px}
.btn.no{background:linear-gradient(#e87a6c,var(--bad));border-color:#a23d30;box-shadow:0 4px 0 #a23d30}
.btn.yes{background:linear-gradient(#78c283,var(--good));border-color:#357a40;box-shadow:0 4px 0 #357a40}
.hrt{color:#d5c7ad;font-size:22px}.hrt.on{color:var(--bad)}
.plus{position:absolute;left:50%;top:0;font:900 26px var(--serif);color:var(--gold-d);animation:rise .9s forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}
@media (max-width:600px){
  .fstage{grid-template-columns:1fr}.fpet{max-width:150px;margin:0 auto}.bubble::before{left:50%;top:-11px;transform:translateX(-50%) rotate(135deg)}
  .seg button{padding:5px 9px;font-size:13px}
  .choices{grid-template-columns:1fr}
  .ranch{grid-template-columns:1fr}
  .stage-bg{max-width:240px;margin:0 auto}
  .elrow{grid-template-columns:repeat(3,1fr)}
  .hero{min-height:320px}.hero .pet{width:170px;bottom:70px}
  .score{font-size:48px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

['chó','','狗','nature'],['mèo','','貓','nature'],['chim','','鳥','nature'],['cá','','魚','nature'],['cây','','樹','nature'],['hoa','','花','nature'],['núi','','山','nature'],['biển','','海','nature'],
['sách','','書','item'],['túi','','包包','item'],['ghế','','椅子','item'],['cửa','','門','item'],['ô','','雨傘','item'],['đồng hồ','','時鐘','item'],['mũ','','帽子','item'],['giày','','鞋子','item'],
['đỏ','','紅色','color'],['xanh dương','','藍色','color'],['vàng','','黃色','color'],['xanh lá','','綠色','color'],['trắng','','白色','color'],['đen','','黑色','color'],['tím','','紫色','color'],['hồng','','粉紅色','color'],

};

RAW.ko.push(

function assign(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))assign(t[k],s[k]);else t[k]=s[k]}return t}
function load(){const d=defaults();try{const r=localStorage.getItem(KEY);if(r)assign(d,JSON.parse(r))}catch(e){}if(!d.settings.askSet)d.settings.ask=true;return d}
let S=load();

/* ---------- 等級 ---------- */
const need=L=>100+(L-1)*40;
function levelInfo(exp){let L=1,r=exp;while(L<30&&r>=need(L)){r-=need(L);L++}return{L,rem:r,need:need(L)}}
const titleOf=L=>L>=15?'星輝大法師':L>=10?'高階魔法師':L>=5?'正式魔法師':'見習學徒';
const AREAS=[['魔法學院大廳',1,'一切旅程的起點。'],['單字試煉教室',1,'每天在這裡練習單字。'],['精靈牧場',2,'與精靈相處、培育的草地。'],['元素圖書館',4,'收藏六大元素的古老藏書。'],['森林探索區',6,'精靈們喜愛的神祕森林。'],['六元素聖塔',10,'星輝大法師才能登上的高塔。']];
const BADGES=[
 ['first','初試啼聲','完成第一次單字試煉',()=>totalSessions()>=1],
 ['perfect','完美魔法','十題全部答對',()=>totalPerfects()>=1],

function checkUnlocks(){const got=[];for(const s of SPIRITS){const st=S.spirits[s.k];if(!st.unlocked&&s.cond&&s.cond.cur()>=s.cond.max){st.unlocked=true;got.push(s.k)}}return got}
function checkBadges(){const got=[];for(const b of BADGES){if(!S.badges[b[0]]&&b[3]()){S.badges[b[0]]=true;got.push(b)}}return got}

/* ---------- 測驗 ---------- */
let Q=null,page='home';
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQuiz(mode){
  const lang=S.lang,L=S.langs[lang],pool=WORDS[lang];
  let picks=[];
  if(mode==='review'){picks=shuffle(L.wrong.map(id=>pool.find(w=>w.id===id)).filter(Boolean)).slice(0,10)}
  const rest=pool.filter(w=>!picks.includes(w));
  while(picks.length<10){
    const ws=rest.map(w=>(L.wrong.includes(w.id)?3:1)/(1+(L.mastery[w.id]||0)));
    let t=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    for(;i<ws.length-1;i++){t-=ws[i];if(t<=0)break}
    picks.push(rest.splice(i,1)[0]);
  }
  shuffle(picks);
  const qs=picks.map(w=>{
    const others=shuffle(pool.filter(x=>x.c===w.c&&x.m!==w.m)).slice(0,3);
    const choices=shuffle([w,...others]);
    return{w,choices,ci:choices.indexOf(w),done:false,pick:-1,ok:null};
  });
  return{mode,lang,qs,idx:0,correct:0,exp:0,coins:0,energy:0,bonus:0,levelUps:[],wrong:[],finished:false,unlocked:[],badges:[],spirit:S.active};
}
function gainExp(n){const b=levelInfo(S.exp).L;S.exp+=n;const a=levelInfo(S.exp).L;if(a>b&&Q){Q.levelUps.push(a);toast('升級！Lv.'+a+'　'+titleOf(a))}}
function gainEnergy(n){const sp=S.spirits[S.active];sp.energy=Math.min(ENERGY_CAP,sp.energy+n);sp.level=Math.min(10,1+Math.floor(sp.energy/50))}
function answer(i){
  if(!Q||Q.finished)return;
  const q=Q.qs[Q.idx];if(!q||q.done)return;
  q.done=true;q.pick=i;q.ok=(i===q.ci);
  const L=S.langs[Q.lang];L.answered++;
  if(q.ok){
    Q.correct++;L.correct++;L.streak++;L.best=Math.max(L.best,L.streak);
    L.mastery[q.w.id]=Math.min(5,(L.mastery[q.w.id]||0)+1);
    gainExp(10);S.coins+=5;gainEnergy(10);Q.exp+=10;Q.coins+=5;Q.energy+=10;
    if(Q.mode==='review')L.wrong=L.wrong.filter(x=>x!==q.w.id);
  }else{
    L.streak=0;L.mastery[q.w.id]=0;if(!L.wrong.includes(q.w.id))L.wrong.push(q.w.id);Q.wrong.push(q.w);
  }
  save();draw();
}
function nextQ(){
  if(!Q)return;const q=Q.qs[Q.idx];if(!q.done)return;
  if(Q.idx<9){Q.idx++;draw()}else finish();
}
function finish(){
  if(Q.finished){page='result';draw();return}
  Q.finished=true;
  const L=S.langs[Q.lang];
  Q.bonus=20;gainExp(20);L.sessions++;
  if(Q.correct===10)L.perfects++;
  if(S.daily.date!==today()){S.daily.date=today();S.daily.count=0}S.daily.count++;
  Q.unlocked=checkUnlocks();Q.badges=checkBadges();
  save();page='result';draw();
}

/* ---------- 精靈猜猜看（60 秒快速賺金幣）----------
   精靈說出「單字＝中文意思」，玩家判斷對或不對。答對 +2 金幣，連續答對每 5 題再 +5。
   答錯會失去一顆愛心（共 3 顆），並把單字加入該語言的錯題紀錄。
   每天最多從這個模式拿 FAST_CAP 金幣，之後仍可練習但不再發金幣。 */
const FAST_CAP=400,FAST_SEC=60,FAST_BASE=2,FAST_COMBO=5;
let F=null,fastTimer=null,fastNext=null;
const fastLeft=()=>{if(S.fast.date!==today()){S.fast.date=today();S.fast.coins=0}return Math.max(0,FAST_CAP-S.fast.coins)};
function stopFast(){clearInterval(fastTimer);clearTimeout(fastNext);fastTimer=null;fastNext=null}
function fastPick(){
  const L=S.langs[F.lang],pool=WORDS[F.lang].filter(w=>!F.recent.includes(w.id));
  const ws=pool.map(w=>(L.wrong.includes(w.id)?3:1)/(1+(L.mastery[w.id]||0)));
  let t=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;for(;i<ws.length-1;i++){t-=ws[i];if(t<=0)break}
  const w=pool[i];F.recent.push(w.id);if(F.recent.length>12)F.recent.shift();
  const truth=Math.random()<.5;
  let shown=w.m;
  if(!truth){const others=WORDS[F.lang].filter(x=>x.c===w.c&&x.m!==w.m);shown=others[rnd(others.length)].m}
  F.cur={w,truth,shown};F.fb=null;F.lock=false;
}
function startFast(){
  stopFast();
  F={lang:S.lang,spirit:S.active,hearts:3,coins:0,correct:0,wrong:0,combo:0,best:0,missed:[],over:false,recent:[],capped:fastLeft()<=0,t0:Date.now(),fb:null,lock:false};
  fastPick();
  fastTimer=setInterval(fastTick,200);
  draw();
}
function fastTick(){
  if(!F||F.over){stopFast();return}
  const left=Math.max(0,FAST_SEC*1000-(Date.now()-F.t0));
  const t=document.getElementById('ft'),b=document.querySelector('#fbar>i');
  if(t)t.textContent=Math.ceil(left/1000);if(b)b.style.width=(left/(FAST_SEC*10))+'%';
  if(left<=0)endFast();
}
function endFast(){
  if(!F||F.over)return;
  F.over=true;stopFast();
  S.fast.best=Math.max(S.fast.best,F.coins);save();draw();
}
function fastAnswer(sayYes){
  if(!F||F.over||F.lock)return;
  F.lock=true;
  const c=F.cur,ok=(sayYes===c.truth),L=S.langs[F.lang];
  L.mastery[c.w.id]=ok?Math.min(5,(L.mastery[c.w.id]||0)+1):0;
  let award=0;
  if(ok){
    F.correct++;F.combo++;F.best=Math.max(F.best,F.combo);
    award=FAST_BASE+(F.combo%FAST_COMBO===0?FAST_COMBO:0);
    award=Math.min(award,fastLeft());
    S.coins+=award;S.fast.coins+=award;F.coins+=award;
  }else{
    F.wrong++;F.hearts--;F.combo=0;
    if(!L.wrong.includes(c.w.id))L.wrong.push(c.w.id);
    F.missed.push(c.w);
  }
  F.fb={ok,award};save();
  if(F.hearts<=0){draw();fastNext=setTimeout(endFast,650);return}
  draw();
  fastNext=setTimeout(()=>{if(!F||F.over)return;fastPick();draw()},ok?420:900);
}
function fastView(){
  const left=fastLeft(),pct=S.fast.coins/FAST_CAP*100;
  if(!F)return `<div class="card gilt"><h2>精靈猜猜看</h2>
  <p>精靈會說出「單字＝中文意思」，你判斷<b>對或不對</b>。60 秒內答得越多、連擊越高，金幣越多。</p>
  <ul class="small" style="line-height:1.9;padding-left:20px;margin:6px 0 12px"><li>答對 +${FAST_BASE} 金幣，連續答對每 ${FAST_COMBO} 題再 +${FAST_COMBO}</li><li>共 3 顆愛心，答錯扣 1 顆，扣完就結束</li><li>答錯的單字會加入${LANG[S.lang].name}錯題紀錄，方便複習</li></ul>
  <div class="small" style="margin-bottom:4px"><b>今日已賺</b> ${S.fast.date===today()?S.fast.coins:0} / ${FAST_CAP} 金幣　<span class="muted">最高單局 ${S.fast.best}</span></div>${bar(pct,'gold')}
  ${left<=0?'<div class="banner" style="margin-top:10px">今天的金幣已達上限，仍可練習，但不會再發金幣。</div>':''}
  <div class="row" style="margin-top:14px"><button class="btn gold big" data-act="fstart">開始（${LANG[S.lang].name}）</button></div></div>`;
  if(F.over){
    const tot=F.correct+F.wrong,acc=tot?Math.round(F.correct/tot*100):0;
    return `<div class="card gilt"><h2>猜猜看結算</h2><div class="score">+${F.coins}<span style="font-size:.4em"> 金幣</span></div><div class="muted">${LANG[F.lang].name}・${F.hearts<=0?'愛心用完了':'時間到'}</div>
    <div class="rw"><div><b>${F.correct}</b>答對</div><div><b>${F.wrong}</b>答錯</div><div><b>${acc}%</b>正確率</div><div><b>${F.best}</b>最高連擊</div></div>
    ${F.capped||left<=0?'<div class="banner">今天的猜猜看金幣已達上限。</div>':`<div class="small muted">今日還可賺 ${left} 金幣</div>`}
    ${F.missed.length?`<h3 style="margin-top:12px">答錯的單字</h3><ul class="wl">${F.missed.map(w=>`<li><span lang="${w.lang}"><b>${wd(w)}</b> ${w.r?'<span class="muted small">'+w.r+'</span>':''}</span><span>${w.m}</span></li>`).join('')}</ul>`:'<p class="muted">沒有答錯，太厲害了！</p>'}
    <div class="row" style="margin-top:14px"><button class="btn gold" data-act="fstart">再玩一次</button><button class="btn ghost" data-act="go" data-v="home">回首頁</button></div></div>`;
  }
  const c=F.cur,sp=S.spirits[F.spirit],fb=F.fb,left0=Math.max(0,FAST_SEC*1000-(Date.now()-F.t0));
  return `<div class="card gilt"><div class="qhead"><b>剩餘 <span id="ft">${Math.ceil(left0/1000)}</span> 秒</b><span aria-label="愛心">${[0,1,2].map(i=>`<span class="hrt ${i<F.hearts?'on':''}">♥</span>`).join('')}</span><b>本局 +${F.coins}</b></div>
  <div class="bar gold" id="fbar"><i style="width:${left0/(FAST_SEC*10)}%"></i></div>
  <div class="fstage"><div class="fpet ${fb?(fb.ok?'happy':'sad'):''}">${spiritSVG(F.spirit,sp.stage)}${fb&&fb.ok?`<span class="plus">+${fb.award}</span>`:''}</div>
  <div class="bubble ${fb?(fb.ok?'ok':'no'):''}"><div class="w" lang="${F.lang}">${c.w.w}</div><div class="r">${c.w.r||''}</div>
  <div class="eq">＝ <b>${fb&&!fb.ok?c.w.m:c.shown}</b> ？</div>${fb&&!fb.ok?`<div class="small" style="margin-top:4px">${c.truth?'這是對的':'你看到的是「'+c.shown+'」，正確是「'+c.w.m+'」'}</div>`:''}</div></div>
  <div class="yn"><button class="btn no" data-act="fno" ${F.lock?'disabled':''}>✗ 不對　←</button><button class="btn yes" data-act="fyes" ${F.lock?'disabled':''}>✓ 對　→</button></div>
  <div class="small muted" style="margin-top:10px;text-align:center">連擊 ${F.combo}${F.combo>0?'　再 '+(FAST_COMBO-F.combo%FAST_COMBO)+' 題有連擊獎勵':''}</div></div>`;
}

review(){
  const L=S.langs[S.lang],pool=WORDS[S.lang],list=L.wrong.map(id=>pool.find(w=>w.id===id)).filter(Boolean);
  return `<div class="card"><h2>錯題複習（${LANG[S.lang].name}）</h2>${list.length?`<p>共有 <b>${list.length}</b> 個待複習單字，複習時會優先出題，答對後會從清單移除。</p><div class="row"><button class="btn gold" data-act="start" data-v="review">開始複習</button></div><ul class="wl" style="margin-top:12px">${list.map(w=>`<li><span lang="${w.lang}"><b>${wd(w)}</b> ${w.r?'<span class="muted small">'+w.r+'</span>':''}</span><span>${w.m}</span></li>`).join('')}</ul>`:`<p>${LANG[S.lang].name}的錯題都複習完了。</p><button class="btn gold" data-act="start" data-v="normal">回到一般練習</button>`}</div>`;
},
ach(){
  const li=levelInfo(S.exp);
  return `<div class="card"><h2>徽章</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b[0]]?'':'off'}"><span class="medal">★</span><div><b>${b[1]}</b><div class="small muted">${b[2]}</div></div></div>`).join('')}</div></div>
  <div class="card" style="margin-top:14px"><h2>學院探索</h2><div class="areas">${AREAS.map(a=>`<div class="area ${li.L>=a[1]?'':'off'}"><span><b>${a[0]}</b><div class="small">${li.L>=a[1]?a[2]:'？？？'}</div></span><span style="white-space:nowrap;font-weight:700">${li.L>=a[1]?'已開放':'Lv.'+a[1]+' 解鎖'}</span></div>`).join('')}</div>
  <p class="small muted">稱號：Lv.1 見習學徒 → Lv.5 正式魔法師 → Lv.10 高階魔法師 → Lv.15 星輝大法師</p></div>`;
},
set(){
  const row=l=>{const L=S.langs[l],acc=L.answered?Math.round(L.correct/L.answered*100):0;return `<tr><th>${LANG[l].name}</th><td>${L.answered}</td><td>${acc}%</td><td>${L.best}</td><td>${L.sessions}</td><td>${L.wrong.length}</td></tr>`};
  return `<div class="card"><h2>設定</h2><h3>學習語言</h3><div class="seg" role="group" aria-label="學習語言">${LANGS.map(l=>`<button data-act="lang" data-v="${l}" aria-pressed="${S.lang===l}">${LANG[l].name}</button>`).join('')}</div>
  <p class="small muted">四種語言的進度、統計與錯題各自獨立保存，切換不會互相覆蓋。</p>
  <h3 style="margin-top:14px">學習統計</h3><div style="overflow-x:auto"><table class="st"><tr><th></th><th>作答</th><th>正確率</th><th>最高連對</th><th>完成挑戰</th><th>錯題</th></tr>${LANGS.map(row).join('')}</table></div>
  <h3 style="margin-top:18px">主精靈</h3><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="askSp" data-act="ask" ${S.settings.ask?'checked':''}> 每次開始試煉前，先讓我選擇主精靈</label><p class="small muted">預設關閉。平常可以在首頁或精靈牧場直接切換主精靈。</p>
  <h3 style="margin-top:18px">重置遊戲資料</h3><div id="resetbox"><button class="btn ghost" data-act="resetAsk">重置全部進度</button></div></div>`;
}};
function draw(){
  $('#topbar').innerHTML=topbar();$('#nav').innerHTML=nav();$('#view').innerHTML=(SUB.includes(page)?'<button class="btn ghost back" data-act="go" data-v="more" style="margin-bottom:12px;padding:6px 16px;font-size:14px">← 更多</button>':'')+VIEWS[page]();$('#aside').innerHTML=aside();
}
function toast(t){const el=$('#toast');el.innerHTML=`<div class="toast" role="status">${t}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.innerHTML=''},2600)}
function openSpirit(k){
  const s=SP[k],st=S.spirits[k],e=EL[k],u=st.unlocked;
  $('#modal').innerHTML=`<div class="modal" data-act="close"><div class="card gilt" role="dialog" aria-modal="true" aria-label="${u?s.names[st.stage-1]:'未解鎖精靈'}"><button class="x" data-act="close" aria-label="關閉">✕</button>
  <div style="max-width:200px;margin:0 auto" class="${u?'':'sil'}">${spiritSVG(k,u?st.stage:1)}</div>
  <h2 style="text-align:center;margin-top:6px">${u?s.names[st.stage-1]:'？？？'}</h2>
  <div class="small muted" style="text-align:center">${e.n}屬性・${RARITY[s.rar]}${u?'・'+STAGE_LABEL[st.stage]+'・Lv.'+st.level:''}</div>
  ${u?`<p>${s.desc}</p><div class="small"><b>培育能量</b> ${st.energy}${st.stage<3?' / '+EVO_AT[st.stage]:''}</div>${bar(st.stage<3?st.energy/EVO_AT[st.stage]*100:100)}
  <div class="stages">${[1,2,3].map(n=>`<div class="${n===st.stage?'on':n>st.stage?'off':''}">${spiritSVG(k,n)}${s.names[n-1]}<br>${STAGE_LABEL[n]}</div>`).join('')}</div>
  <div class="row" style="margin-top:12px;justify-content:center">${S.active===k?'<span class="pill" style="color:var(--good)">目前主精靈</span>':`<button class="btn" data-act="active" data-v="${k}">設為主精靈</button>`}</div>`
  :(s.price?`<p>${s.desc}</p><p>取得方式：<b>${s.price} 金幣購買</b></p><div class="small muted" style="margin-bottom:4px">目前金幣 ${S.coins} / ${s.price}</div>${bar(Math.min(S.coins,s.price)/s.price*100,'gold')}<div class="row" style="margin-top:12px;justify-content:center"><button class="btn gold" data-act="buy" data-v="${k}" ${S.coins>=s.price?'':'disabled'}>購買（${s.price} 金幣）</button></div>`:`<p>取得條件：<b>${s.cond.text}</b></p><div class="small muted" style="margin-bottom:4px">目前進度 ${Math.min(s.cond.cur(),s.cond.max)} / ${s.cond.max}</div>${bar(Math.min(s.cond.cur(),s.cond.max)/s.cond.max*100)}`)}</div></div>`;
}

/* ---------- 選擇本次主精靈 ---------- */
let pick=null;
function launch(v){Q=buildQuiz(v);page='quiz';draw();window.scrollTo(0,0)}
function openPicker(){
  const un=SPIRITS.filter(s=>S.spirits[s.k].unlocked);
  $('#modal').innerHTML=`<div class="modal" data-act="close"><div class="card gilt" role="dialog" aria-modal="true" aria-label="選擇本次主精靈"><button class="x" data-act="close" aria-label="關閉">✕</button>
  <h2>選擇本次主精靈</h2><p class="small muted" style="margin-top:-4px">答對題目獲得的培育能量，會全部給這隻精靈。</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${un.map(s=>{const st=S.spirits[s.k],th=st.stage<3?EVO_AT[st.stage]:ENERGY_CAP;return `<button class="pcard" data-act="sel" data-v="${s.k}" aria-pressed="${pick.sel===s.k}" style="${pick.sel===s.k?'border-color:var(--purple);background:var(--purple-l)':''}">${spiritSVG(s.k,st.stage)}<div class="nm" style="font-size:15px">${s.names[st.stage-1]}</div><div class="small muted">Lv.${st.level}・${EL[s.k].n}</div><div class="bar" style="height:8px;margin-top:4px"><i style="width:${st.energy/th*100}%"></i></div></button>`}).join('')}</div>
  <div class="row" style="margin-top:14px;justify-content:center"><button class="btn gold big" data-act="launch">出發！</button></div></div></div>`;
}

/* ---------- 事件 ---------- */
const ACT={
 go(v){if(v==='quiz'&&Q&&Q.finished){Q=null}if(v!=='fast'){stopFast();F=null}else if(F&&F.over){F=null}page=v;draw();window.scrollTo(0,0)},
 lang(v){if(S.lang===v)return;S.lang=v;Q=null;stopFast();F=null;save();if(page==='quiz'||page==='result')page='home';draw();toast('已切換為'+LANG[v].name)},
 fstart(){startFast()},
 fyes(){fastAnswer(true)},
 fno(){fastAnswer(false)},
 start(v){
  const un=SPIRITS.filter(s=>S.spirits[s.k].unlocked);
  if(!S.settings.ask||un.length<2){launch(v);return}
  pick={mode:v,sel:S.active};openPicker();
 },
 sel(v){pick.sel=v;openPicker()},
 launch(){const m=pick.mode;S.active=pick.sel;save();$('#modal').innerHTML='';launch(m)},
 pick(v){answer(+v)},
 next(){nextQ()},
 speak(){try{const q=Q&&Q.qs[Q.idx];if(!q)return;const u=new SpeechSynthesisUtterance(q.w.w);u.lang=LANG[Q.lang].tts;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('此瀏覽器不支援發音')}},
 active(v){if(!S.spirits[v].unlocked)return;S.active=v;save();$('#modal').innerHTML='';draw()},
 open(v){openSpirit(v)},
 buy(v){const s=SP[v],st=S.spirits[v];if(st.unlocked||!s.price||S.coins<s.price)return;S.coins-=s.price;st.unlocked=true;checkBadges();save();draw();openSpirit(v);toast('購買成功！'+s.names[0]+' 加入牧場')},
 ask(){S.settings.ask=!S.settings.ask;S.settings.askSet=true;save();draw()},
 close(){$('#modal').innerHTML=''},
 evolve(){
  const sp=S.spirits[S.active];if(sp.stage>=3)return;
  const th=EVO_AT[sp.stage],cost=EVO_COST[sp.stage];
  if(sp.energy<th||S.coins<cost)return;
  S.coins-=cost;sp.stage++;S.stats.evolutions++;checkBadges();
  save();draw();const p=$('#pet');if(p)p.classList.add('pop');
  toast('進化成功！'+SP[S.active].names[sp.stage-1]);
 },
 resetAsk(){$('#resetbox').innerHTML='<p class="small">這會清除所有等級、金幣、精靈與錯題，無法復原。</p><div class="row"><button class="btn" style="background:var(--bad);border-color:#a23d30;box-shadow:0 4px 0 #a23d30" data-act="resetYes">確定重置</button><button class="btn ghost" data-act="resetNo">取消</button></div>'},
 resetNo(){draw()},
 resetYes(){S=defaults();Q=null;try{localStorage.removeItem(KEY)}catch(e){}save();page='home';draw();toast('已重置遊戲資料')}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('modal')&&e.target!==t)return; // 點在彈窗內容上不關閉
  if(ACT[t.dataset.act])ACT[t.dataset.act](t.dataset.v);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')ACT.close();
  if(page==='fast'&&F&&!F.over){if(e.key==='ArrowRight')fastAnswer(true);else if(e.key==='ArrowLeft')fastAnswer(false);return}
  if(page!=='quiz'||!Q||Q.finished)return;
  if(e.key>='1'&&e.key<='4')answer(+e.key-1);
  else if(e.key==='Enter'&&Q.qs[Q.idx].done)nextQ();
});
checkUnlocks();checkBadges();save();draw();
window.__wordmon={get S(){return S},get Q(){return Q},get F(){return F},get W(){return WORDS},get SP(){return SPIRITS}};
})();
</script>

</html>
